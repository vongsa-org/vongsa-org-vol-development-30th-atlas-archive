<meta property="og:description" content="(사)자원봉사능력개발원의 30년을 지도로 보다." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ko_KR" />

<meta name="twitter:title" content="Atlas : 우리가 남긴 궤적을 따라 · 자원봉사능력개발원" />
<meta name="theme-color" content="#a11f2d" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 100; font-display: swap; src: url('fonts/Pretendard-Thin.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 200; font-display: swap; src: url('fonts/Pretendard-ExtraLight.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 300; font-display: swap; src: url('fonts/Pretendard-Light.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 400; font-display: swap; src: url('fonts/Pretendard-Regular.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 500; font-display: swap; src: url('fonts/Pretendard-Medium.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; font-display: swap; src: url('fonts/Pretendard-SemiBold.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; font-display: swap; src: url('fonts/Pretendard-Bold.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 800; font-display: swap; src: url('fonts/Pretendard-ExtraBold.woff') format('woff'); }
  @font-face { font-family: 'Pretendard'; font-weight: 900; font-display: swap; src: url('fonts/Pretendard-Black.woff') format('woff'); }

  :root {
    --bg: #f8f7f3; --bg-2: #f1efe9;
    --ink: #15151a; --ink-2: #45464a; --muted: #8e8e8a;
    --paper: #ffffff;
    --accent: #a11f2d; --accent-soft: #d68a8a; --accent-deep: #7a1620;
    --accent-rgb: 161, 31, 45;
    --shadow-sm: 0 1px 2px rgba(26,23,20,.04), 0 2px 6px rgba(26,23,20,.05);
    --shadow-md: 0 4px 12px rgba(26,23,20,.06), 0 8px 24px rgba(26,23,20,.06);
    --shadow-lg: 0 12px 32px rgba(26,23,20,.10), 0 4px 12px rgba(26,23,20,.06);
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --ease-out: cubic-bezier(.22,1,.36,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body.theme-dark {
    --bg: #0c0d10; --bg-2: #16181d;
    --ink: #f3eee2; --ink-2: #c0b8a6; --muted: #6f6857;
    --paper: #14161b;
    --accent: #e85d3c; --accent-soft: #c5482a;
    --accent-rgb: 232, 93, 60;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.3);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    transition: background .4s var(--ease-out), color .4s var(--ease-out);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { min-height: 100vh; overflow-x: hidden; }
html { overflow-x: hidden; }
  ::selection { background: var(--accent); color: #fbf7f0; }

  /* ── Layout ── */
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(440px, .85fr);
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas: "header header" "orgs orgs" "map panel" "timeline timeline";
    height: 100vh; width: 100vw;
  }
  @media (max-width: 1100px) {
    .app { grid-template-columns: minmax(0, 1.2fr) minmax(380px, .9fr); }
    header.top, .orgs, .timeline { padding-left: 24px; padding-right: 24px; }
    .panel { padding: 24px 26px 32px; }
  }

  /* ── Mobile ── */
  @media (max-width: 820px) {
    html, body { overflow: hidden !important; width: 100% !important; }

    .app {
      position: fixed !important;
      inset: 0 !important;
      display: grid !important;
      grid-template-columns: 100% !important;
      grid-template-rows: auto auto 1fr !important;
      grid-template-areas: "header" "orgs" "map" !important;
      overflow: hidden !important;
    }

    /* 헤더 */
    header.top {
      grid-area: header;
      flex-direction: row !important;
      align-items: center !important;
      padding: 8px 14px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .header-right { display: none !important; }
    .header-stats { display: none !important; }
    .brand h1 { font-size: 14px !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
    .brand .sub { display: none !important; }
    .brand-compass { width: 24px !important; height: 24px !important; flex-shrink: 0 !important; }

    /* 기관 탭 */
    .orgs {
      grid-area: orgs !important;
      padding: 6px 12px !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      scrollbar-width: none !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .orgs::-webkit-scrollbar { display: none !important; }
    .org-btn {
      flex-shrink: 0 !important; font-size: 11px !important;
      padding: 5px 11px !important;
      border-radius: 20px !important;
    }
    .org-btn.active { box-shadow: 0 2px 8px rgba(0,0,0,.15) !important; }

    /* 숨길 요소들 */
    .legend, .search-wrap, .timeline, .style-switch, .map-corner, .map-title { display: none !important; }

    /* 지도 */
    .map-wrap {
      grid-area: map !important;
      position: relative !important;
      min-height: 0 !important;
      height: 100% !important;
      border: none !important;
      overflow: hidden !important;
      width: 100% !important;
    }
    #map {
      position: absolute !important;
      inset: 0 !important;
      z-index: 1 !important;
    }

    /* 패널 - 지도 위에 뜨는 바텀시트 */
    .panel {
      position: fixed !important;
      left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
      height: 46vh !important;
      max-height: 88vh !important;
      border-left: none !important;
      border-top-left-radius: 18px !important;
      border-top-right-radius: 18px !important;
      box-shadow: 0 -4px 20px rgba(0,0,0,.15) !important;
      z-index: 10 !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 0 0 16px !important;
      transition: height .3s ease !important;
      overflow: hidden !important;
    }
    .panel.expanded { height: 88vh !important; }
    .panel.collapsed { height: 44px !important; overflow: hidden !important; }
    /* 접혔을 때 내용 숨기기 */
    .panel.collapsed .panel-scroll { display: none !important; }
    .panel.collapsed .org-head { display: none !important; }

    /* 핸들 */
    .sheet-handle {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      padding: 10px 16px 10px !important;
      cursor: pointer !important;
      flex-shrink: 0 !important;
      gap: 6px !important;
    }
    .bar {
      width: 36px !important; height: 4px !important;
      background: rgba(42,36,29,.2) !important;
      border-radius: 2px !important;
      flex-shrink: 0 !important;
    }

    /* 패널 내부 스크롤 */
    .panel-scroll {
      flex: 1 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      padding: 0 14px !important;
      scrollbar-width: none !important;
    }
    .panel-scroll::-webkit-scrollbar { display: none !important; }

    /* 텍스트/컨텐츠 */
    .org-head { padding: 0 !important; }
    .place-tabs { overflow-x: auto !important; scrollbar-width: none !important; flex-wrap: nowrap !important; padding: 6px 0 !important; }
    .place-tabs::-webkit-scrollbar { display: none !important; }
    .place-tab { flex-shrink: 0 !important; font-size: 11px !important; }
    .ph-wrap { padding: 0 !important; width: 100% !important; box-sizing: border-box !important; }
    .ph-name { font-size: 20px !important; }
    .ph-story { font-size: 13px !important; }
    .ph-miles li { font-size: 12px !important; padding-left: 24px !important; }
    .ph-photo-item img { width: 100% !important; height: auto !important; border-radius: 10px !important; }
    .ph-photos { gap: 10px !important; }
    .ph-addr-block { border-radius: 10px !important; }
    .ph-mile-title { font-size: 9px !important; margin-top: 16px !important; }

.ph-miles .yr { font-size: 10px !important; min-width: 48px !important; flex-shrink: 0 !important; color: var(--accent) !important; }
.ph-miles .tt { flex: 1 !important; word-break: keep-all !important; line-height: 1.4 !important; }
    .photo-slider .slider-arrow { opacity: 1 !important; }
  }
  @media (max-width: 480px) {
    .splash {
      padding: 40px 24px !important;
      justify-content: center !important;
    }
    .splash-compass { width: 120px !important; height: 120px !important; }
    .splash-title { font-size: clamp(22px, 6vw, 32px) !important; margin-top: 20px !important; }
    .splash-sub { font-size: 9px !important; letter-spacing: 0.05em !important; }
    .splash-counters { margin-top: 36px !important; gap: 0 !important; }
    .splash-counter { padding: 16px 20px !important; }
    .splash-counter .num { font-size: 36px !important; }
    .splash-enter { margin-top: 28px !important; padding: 13px 36px !important; font-size: 14px !important; }
  }

  /* ── Header ── */
  header.top {
    grid-area: header; display: flex; align-items: center;
    justify-content: space-between;
    padding: 18px 36px 14px;
    border-bottom: 1px solid rgba(42,36,29,.10);
    background: var(--bg); gap: 20px; z-index: 5; position: relative;
  }
  body.theme-dark header.top { border-bottom-color: rgba(255,255,255,.06); }
  .header-left { display: flex; align-items: center; gap: 0; flex: 1; min-width: 0; }
  .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .header-stats {
    display: flex; gap: 28px; align-items: center;
    margin-left: 28px; padding-left: 28px;
    border-left: 1px solid rgba(42,36,29,.12);
  }
  body.theme-dark .header-stats { border-left-color: rgba(255,255,255,.10); }
  .header-stats .stat .num {
    font-family: var(--font); font-size: 22px; font-weight: 700;
    color: var(--ink); line-height: 1; letter-spacing: -0.03em;
  }
  .header-stats .stat .num small {
    font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; letter-spacing: 0;
  }
  .header-stats .stat .lbl {
    font-family: var(--font); font-size: 9px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px;
  }
  @media (max-width: 1100px) { .header-stats { gap: 20px; margin-left: 20px; padding-left: 20px; } }

  .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .brand .qmark {
    font-family: var(--font); font-size: 36px; line-height: 1;
    color: var(--accent); font-weight: 900;
  }
  .brand h1 {
    font-family: var(--font); font-size: 21px; margin: 0;
    font-weight: 700; letter-spacing: -0.02em; white-space: nowrap;
  }
  .brand .sub {
    font-family: var(--font); font-size: 10px; color: var(--muted);
    letter-spacing: 0.04em; margin-top: 3px; white-space: nowrap;
  }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 11px; color: var(--ink-2); }
  .legend .swatch { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; }
  .legend .pin-sw { background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 2px rgba(var(--accent-rgb),.18); }
  .legend .past-sw { background: var(--ink); opacity: .3; border-radius: 50%; }

  /* ── Search bar ── */
  .search-wrap {
    position: relative; flex-shrink: 0;
  }
  .search-input {
    font-family: var(--font); font-size: 12px; color: var(--ink);
    background: var(--bg-2); border: 1px solid rgba(42,36,29,.16);
    border-radius: var(--radius-md);
    padding: 8px 14px 8px 34px;
    width: 200px; outline: none;
    transition: border-color .2s, width .3s var(--ease-out), box-shadow .2s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); width: 260px; box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.12); }
  body.theme-dark .search-input { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); color: var(--ink); }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--muted); pointer-events: none;
  }
  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--paper); border: 1px solid rgba(42,36,29,.14);
    border-radius: var(--radius-md); box-shadow: var(--shadow-md);
    z-index: 200; overflow: hidden; max-height: 280px; overflow-y: auto;
  }
  body.theme-dark .search-results { background: var(--paper); border-color: rgba(255,255,255,.10); }
  .search-result-item {
    padding: 10px 14px; cursor: pointer; font-size: 12px;
    border-bottom: 1px solid rgba(42,36,29,.06);
    transition: background .15s;
    display: flex; flex-direction: column; gap: 2px;
  }
  body.theme-dark .search-result-item { border-bottom-color: rgba(255,255,255,.06); }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--bg-2); }
  body.theme-dark .search-result-item:hover { background: rgba(255,255,255,.04); }
  .sri-name { font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  .sri-org { font-size: 10px; color: var(--muted); letter-spacing: 0.02em; }
  .sri-mark { color: var(--accent); }
  .search-empty { padding: 16px 14px; font-size: 12px; color: var(--muted); text-align: center; }

  /* ── Keyboard hint ── */
  .kb-hint {
    font-family: var(--font); font-size: 10px; color: var(--muted);
    letter-spacing: 0.02em; display: flex; gap: 8px; align-items: center;
    white-space: nowrap; flex-shrink: 0;
    border-left: 1px solid rgba(42,36,29,.12); padding-left: 14px;
  }
  body.theme-dark .kb-hint { border-left-color: rgba(255,255,255,.10); }
  .kb-label {
    font-family: var(--font); font-size: 9px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase;
    margin-right: 2px;
  }
  .kb-hint kbd {
    font-family: var(--font); font-size: 9px; font-weight: 700;
    color: var(--ink-2); background: var(--bg-2);
    border: 1px solid rgba(42,36,29,.18); border-radius: 4px;
    padding: 2px 6px; letter-spacing: 0;
  }
  body.theme-dark .kb-hint kbd { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
  @media (max-width: 1200px) { .kb-hint { display: none; } }

  /* ── Org switcher ── */
  .orgs {
    grid-area: orgs; display: flex; gap: 8px;
    padding: 12px 36px; border-bottom: 1px solid rgba(42,36,29,.10);
    background: var(--bg); overflow-x: auto; scrollbar-width: thin; z-index: 4;
  }
  body.theme-dark .orgs { border-bottom-color: rgba(255,255,255,.06); }
  .org-pill {
    flex-shrink: 0; padding: 7px 15px;
    border: 1px solid rgba(42,36,29,.20); background: transparent;
    color: var(--ink-2); border-radius: 999px; font-size: 12px;
    cursor: pointer; font-family: var(--font);
    transition: transform .32s var(--ease-spring), background .22s var(--ease-out),
                color .22s var(--ease-out), border-color .22s var(--ease-out), box-shadow .22s var(--ease-out);
    display: flex; align-items: center; gap: 7px; letter-spacing: -0.005em;
  }
  body.theme-dark .org-pill { border-color: rgba(255,255,255,.15); }
  .org-pill .num { font-family: var(--font); font-size: 10px; color: var(--muted); font-weight: 500; }
  .org-pill:hover { border-color: var(--ink); color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .org-pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); box-shadow: var(--shadow-sm); }
  .org-pill.on .num { color: var(--accent-soft); }
  .org-pill .badge {
    background: rgba(255,255,255,.18); padding: 1px 6px; border-radius: 99px;
    font-family: var(--font); font-size: 10px; font-weight: 600;
  }
  .org-pill:not(.on) .badge { background: rgba(42,36,29,.06); color: var(--muted); }
  body.theme-dark .org-pill:not(.on) .badge { background: rgba(255,255,255,.05); }
  .org-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Map ── */
  .map-wrap {
    grid-area: map; position: relative; background: var(--bg);
    overflow: hidden; border-right: 1px solid rgba(42,36,29,.10); min-height: 480px;
  }
  body.theme-dark .map-wrap { border-right-color: rgba(255,255,255,.06); }
  #map { position: absolute; inset: 0; z-index: 1; }
  .leaflet-container { background: var(--bg-2); font-family: var(--font); }
  .leaflet-control-attribution { background: rgba(255,255,255,.7) !important; font-size: 9px !important; color: var(--muted) !important; }
  body.theme-dark .leaflet-control-attribution { background: rgba(0,0,0,.5) !important; color: rgba(255,255,255,.5) !important; }
  body.theme-dark .leaflet-control-attribution a { color: rgba(255,255,255,.7) !important; }
  .leaflet-control-zoom { border: 1px solid rgba(42,36,29,.18) !important; box-shadow: var(--shadow-sm) !important; border-radius: var(--radius-sm) !important; overflow: hidden; }
  body.theme-dark .leaflet-control-zoom a { background: rgba(20,22,27,.92) !important; color: rgba(243,238,226,.85) !important; border-bottom-color: rgba(243,238,226,.16) !important; }
  body.theme-dark .leaflet-control-zoom a:hover { background: rgba(35,38,46,.95) !important; }

  .map-overlay { position: absolute; z-index: 5; pointer-events: none; }
  .map-title {
    top: 20px; left: 20px; font-family: var(--font); font-size: 12px; font-weight: 700;
    color: var(--ink-2); letter-spacing: 0.22em;
    background: var(--paper); padding: 7px 13px;
    border: 1px solid rgba(42,36,29,.18); border-radius: var(--radius-sm);
    pointer-events: auto; box-shadow: var(--shadow-sm);
  }
  body.theme-dark .map-title { background: rgba(20,22,27,.85); color: rgba(243,238,226,.85); border-color: rgba(243,238,226,.16); backdrop-filter: blur(8px); }
  .map-corner {
    bottom: 16px; left: 20px; font-family: var(--font); font-size: 10px;
    color: var(--muted); letter-spacing: 0.04em;
    background: var(--paper); padding: 5px 10px;
    border: 1px solid rgba(42,36,29,.14); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
  }
  body.theme-dark .map-corner { background: rgba(20,22,27,.85); border-color: rgba(243,238,226,.14); color: rgba(243,238,226,.55); backdrop-filter: blur(8px); }

  /* Reset-view button */
  .map-reset {
    position: absolute; bottom: 16px; right: 20px; z-index: 5;
    background: var(--paper); border: 1px solid rgba(42,36,29,.18);
    border-radius: var(--radius-sm); padding: 7px 12px;
    font-family: var(--font); font-size: 11px; font-weight: 500;
    color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow-sm);
    display: flex; align-items: center; gap: 6px;
    transition: all .2s var(--ease-out);
  }
  .map-reset:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  body.theme-dark .map-reset { background: rgba(20,22,27,.85); border-color: rgba(243,238,226,.18); color: rgba(243,238,226,.7); backdrop-filter: blur(8px); }
  body.theme-dark .map-reset:hover { color: var(--accent); border-color: var(--accent); }

  .style-switch {
    position: absolute; top: 20px; right: 20px; z-index: 5;
    display: flex; background: var(--paper); border: 1px solid rgba(42,36,29,.18);
    border-radius: var(--radius-sm); overflow: hidden; pointer-events: auto; box-shadow: var(--shadow-sm);
  }
  body.theme-dark .style-switch { background: rgba(20,22,27,.9); border-color: rgba(243,238,226,.18); backdrop-filter: blur(8px); }
  .style-switch button {
    background: transparent; border: none; padding: 7px 12px; font-size: 11px;
    cursor: pointer; font-family: var(--font); color: var(--ink-2);
    letter-spacing: 0.02em; transition: color .18s, background .18s;
  }
  .style-switch button + button { border-left: 1px solid rgba(42,36,29,.12); }
  body.theme-dark .style-switch button + button { border-left-color: rgba(243,238,226,.10); }
  .style-switch button:hover { color: var(--ink); }
  .style-switch button.on { background: var(--ink); color: var(--bg); }

  /* ── Markers ── */
  .pin-marker {
    position: relative; width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-size: 12px; font-weight: 700;
    border: 3px solid var(--paper);
    box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 4px 14px rgba(var(--accent-rgb),.22);
    cursor: pointer; transition: transform .32s var(--ease-spring) !important; will-change: transform;
  }
  body.theme-dark .pin-marker { border-color: #0c0d10; box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3), 0 4px 14px rgba(var(--accent-rgb),.4); }
  .pin-marker:hover { transform: scale(1.14); }
  .pin-marker.past { background: rgba(80,72,60,.85); opacity: .65; box-shadow: 0 2px 6px rgba(0,0,0,.14); }
  body.theme-dark .pin-marker.past { background: rgba(243,238,226,.4); }
  .pin-marker.active { transform: scale(1.18); }
  .pin-marker.active::before, .pin-marker.active::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--accent); pointer-events: none;
    animation: pinPulse 2s var(--ease-out) infinite;
  }
  .pin-marker.active::after { animation-delay: 1s; }
  @keyframes pinPulse {
    0% { transform: scale(1); opacity: .65; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .pin-label-overlay {
    background: var(--paper); color: var(--ink); padding: 5px 10px;
    border-radius: var(--radius-sm); font-size: 11px; font-weight: 500;
    border: 1px solid rgba(42,36,29,.16); white-space: nowrap;
    transform: translateX(20px) translateY(-50%); box-shadow: var(--shadow-sm);
  }
  body.theme-dark .pin-label-overlay { background: rgba(20,22,27,.94); color: rgba(243,238,226,.94); border-color: rgba(243,238,226,.18); backdrop-filter: blur(8px); }
  .pin-label-overlay .yr { font-size: 9px; color: var(--muted); margin-right: 6px; }
  .leaflet-tooltip.pin-tooltip { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; white-space: nowrap; }
  .leaflet-tooltip.pin-tooltip::before { display: none !important; }

  /* ── Panel ── */
  .panel {
    grid-area: panel; background: var(--paper); overflow-y: auto;
    padding: 28px 32px 36px; border-left: 1px solid rgba(42,36,29,.10);
    position: relative; box-shadow: inset 1px 0 0 rgba(20,17,14,.04);
  }
  body.theme-dark .panel { border-left-color: rgba(255,255,255,.06); }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 2px; }
  .panel-scroll::-webkit-scrollbar { width: 4px; }
  .panel-scroll::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 2px; }
  .panel-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--muted); padding: 40px; }
  .panel-content { animation: panelFadeIn .4s var(--ease-out); }
  @keyframes panelFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .panel-content > * { animation: panelFadeIn .4s var(--ease-out) both; }
  .panel-content > *:nth-child(1) { animation-delay: 0s; }
  .panel-content > *:nth-child(2) { animation-delay: .05s; }
  .panel-content > *:nth-child(3) { animation-delay: .09s; }
  .panel-content > *:nth-child(4) { animation-delay: .13s; }
  .panel-content > *:nth-child(5) { animation-delay: .17s; }
  .panel-content > *:nth-child(6) { animation-delay: .21s; }
  .panel-content > *:nth-child(7) { animation-delay: .25s; }

  /* ── Photo Slider ── */
  .photo-slider {
    width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md);
    margin-bottom: 20px; position: relative; overflow: hidden;
    box-shadow: var(--shadow-sm); border: 1px solid rgba(42,36,29,.08);
    background: var(--bg-2); user-select: none;
  }
  .photo-slider-track {
    display: flex; height: 100%;
    transition: transform .45s var(--ease-out);
    will-change: transform;
  }
  .photo-slide {
    flex: 0 0 100%; height: 100%; position: relative; overflow: hidden;
  }
  .photo-slide img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; pointer-events: none;
  }
  .photo-slide canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  /* arrows */
  .slider-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 10; background: rgba(255,255,255,.85); border: none;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    transition: background .2s, transform .2s var(--ease-spring), opacity .2s;
    opacity: 0;
  }
  body.theme-dark .slider-arrow { background: rgba(20,22,27,.85); }
  .slider-arrow svg { width: 14px; height: 14px; color: var(--ink); stroke-width: 2.2; }
  body.theme-dark .slider-arrow svg { color: var(--ink); }
  .slider-arrow:hover { background: #fff; transform: translateY(-50%) scale(1.1); }
  body.theme-dark .slider-arrow:hover { background: rgba(40,42,50,.95); }
  .slider-arrow.prev { left: 10px; }
  .slider-arrow.next { right: 10px; }
  .photo-slider:hover .slider-arrow { opacity: 1; }
  .slider-arrow:disabled { opacity: 0 !important; pointer-events: none; }
  /* dots */
  .slider-dots {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 10;
  }
  .slider-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.5); border: none; padding: 0; cursor: pointer;
    transition: background .2s, transform .2s var(--ease-spring);
  }
  .slider-dot.active { background: #fff; transform: scale(1.3); }
  /* year + caption tags */
  .slider-year-tag {
    position: absolute; top: 12px; left: 12px;
    font-family: var(--font); font-size: 10px; font-weight: 600;
    color: var(--ink-2); background: var(--paper); padding: 4px 8px;
    border-radius: 4px; border: 1px solid rgba(42,36,29,.12); z-index: 5;
    letter-spacing: 0.04em; backdrop-filter: blur(6px);
  }
  body.theme-dark .slider-year-tag { background: rgba(20,22,27,.85); border-color: rgba(243,238,226,.16); color: rgba(243,238,226,.85); }
  .slider-caption {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    padding: 28px 14px 12px;
    background: linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 100%);
    font-family: var(--font); font-size: 10px; font-weight: 500;
    color: rgba(255,255,255,.8); letter-spacing: 0.04em;
    pointer-events: none;
  }
  .slider-count {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    font-family: var(--font); font-size: 9px; font-weight: 600;
    color: rgba(255,255,255,.7); background: rgba(0,0,0,.3);
    padding: 3px 8px; border-radius: 99px; letter-spacing: 0.04em;
    backdrop-filter: blur(4px);
  }
  .ph-photo-era {
    width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md);
    margin-bottom: 20px; position: relative; overflow: hidden;
    box-shadow: var(--shadow-sm); border: 1px solid rgba(42,36,29,.08);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-2);
    filter: contrast(1.04) saturate(.92);
    transition: filter .4s var(--ease-out);
  }
  .ph-photo-era:hover { filter: contrast(1.08) saturate(1); }
  .ph-photo-era canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ph-photo-era .era-year-tag {
    position: absolute; top: 12px; left: 12px;
    font-family: var(--font); font-size: 10px; font-weight: 600;
    color: var(--ink-2); background: var(--paper); padding: 4px 8px;
    border-radius: 4px; border: 1px solid rgba(42,36,29,.12); z-index: 2;
    letter-spacing: 0.04em; backdrop-filter: blur(6px);
  }
  body.theme-dark .ph-photo-era .era-year-tag { background: rgba(20,22,27,.85); border-color: rgba(243,238,226,.16); color: rgba(243,238,226,.85); }
  .ph-photo-era .era-label {
    position: absolute; bottom: 12px; right: 12px;
    font-family: var(--font); font-size: 9px; font-weight: 500;
    color: rgba(255,255,255,.7); letter-spacing: 0.05em; text-transform: uppercase;
    z-index: 2; text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }

  /* ── Org head ── */
  .org-head { border-bottom: 1px solid rgba(42,36,29,.14); padding-bottom: 16px; margin-bottom: 20px; }
  body.theme-dark .org-head { border-bottom-color: rgba(255,255,255,.10); }
  .org-head .ekey { font-family: var(--font); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .org-head .ename { font-family: var(--font); font-size: 21px; font-weight: 700; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.015em; }
  .org-head .eperiod { font-family: var(--font); font-size: 12px; color: var(--ink-2); letter-spacing: 0.02em; }

  /* ── Place detail ── */
  .ph-meta { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .ph-num { font-family: var(--font); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; font-weight: 500; }
  .ph-yrs { font-family: var(--font); font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
  .ph-name { font-family: var(--font); font-size: 26px; line-height: 1.2; margin: 6px 0 10px; font-weight: 700; letter-spacing: -0.018em; }
  .ph-addr {
    font-family: var(--font); font-size: 13px; color: var(--ink-2);
    padding: 12px 14px; background: var(--bg-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin-bottom: 20px; line-height: 1.6;
  }
  body.theme-dark .ph-addr { background: rgba(232,93,60,.08); }
  .ph-addr .label { font-family: var(--font); font-size: 9px; color: var(--muted); letter-spacing: 0.08em; display: block; margin-bottom: 4px; text-transform: uppercase; }
  .ph-story { font-family: var(--font); font-size: 14px; line-height: 1.85; color: var(--ink-2); margin-bottom: 20px; text-wrap: pretty; }
  .ph-story p { margin: 0 0 12px; }
  .ph-mile-title {
    font-family: var(--font); font-size: 10px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin: 24px 0 12px; padding-top: 16px;
    border-top: 1px solid rgba(20,17,14,.08); position: relative;
  }
  .ph-mile-title::before { content: ''; display: inline-block; width: 14px; height: 1px; background: var(--accent); vertical-align: 4px; margin-right: 8px; opacity: .7; }
  body.theme-dark .ph-mile-title { border-top-color: rgba(255,255,255,.08); }
  .ph-miles {
    list-style: none !important; padding: 0 !important; padding-inline-start: 0 !important;
    margin: 0 0 20px 5px; border-left: 1.5px solid rgba(42,36,29,.5); position: relative;
  }
  body.theme-dark .ph-miles { border-left-color: rgba(255,255,255,.32); }
  .ph-miles li { list-style: none !important; padding: 6px 0 6px 20px; font-family: var(--font); font-size: 13px; color: var(--ink); position: relative; line-height: 1.55; }
  .ph-miles li::marker { content: none; }
  .ph-miles li::before { content: ''; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; z-index: 2; }
  .ph-miles li .yr { font-family: var(--font); color: var(--muted); font-size: 11px; margin-right: 8px; font-weight: 500; }
  .ph-note { font-family: var(--font); font-size: 11.5px; color: var(--muted); font-style: italic; padding-top: 14px; border-top: 1px dashed rgba(42,36,29,.18); line-height: 1.6; }
  body.theme-dark .ph-note { border-top-color: rgba(255,255,255,.12); }

  /* ── Nav buttons ── */
  .ph-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(42,36,29,.12); }
  body.theme-dark .ph-nav { border-top-color: rgba(255,255,255,.10); }
  .ph-nav-btn {
    background: var(--bg-2); border: 1px solid rgba(42,36,29,.10);
    border-radius: var(--radius-md); padding: 11px 13px; cursor: pointer;
    font-family: var(--font); text-align: left;
    transition: transform .32s var(--ease-spring), background .22s, color .22s, border-color .22s, box-shadow .22s;
    display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); box-shadow: var(--shadow-sm);
  }
  body.theme-dark .ph-nav-btn { background: rgba(243,238,226,.04); border-color: rgba(243,238,226,.08); }
  .ph-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .ph-nav-btn:disabled { opacity: .35; cursor: default; }
  .ph-nav-btn .arrow { font-family: var(--font); font-size: 11px; color: var(--accent); letter-spacing: 0.04em; font-weight: 600; }
  .ph-nav-btn.next { text-align: right; }
  .ph-nav-btn .nm { font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; line-height: 1.3; }
  .ph-nav-btn:disabled .nm { color: var(--muted); }

  /* ── Timeline ── */
  .timeline {
    grid-area: timeline; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    border-top: 1px solid rgba(42,36,29,.10);
    padding: 8px 36px 10px; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none;
  }
  .timeline::-webkit-scrollbar { display: none; }
  body.theme-dark .timeline { border-top-color: rgba(255,255,255,.06); }
  .tl-label { font-family: var(--font); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; font-weight: 600; }
  .tl-track { position: relative; flex: 1; height: 50px; min-width: 600px; padding: 0 24px; }
  .tl-line { position: absolute; left: 24px; right: 24px; top: 25px; height: 1px; background: rgba(42,36,29,.20); }
  body.theme-dark .tl-line { background: rgba(255,255,255,.16); }
  .tl-tick-wrap {
    position: absolute; top: 15px;
    transform: translateX(-50%);
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tl-tick {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--ink);
    transition: background .2s, border-color .2s, box-shadow .2s;
    flex-shrink: 0;
  }
  body.theme-dark .tl-tick { border-color: var(--ink-2); }
  .tl-tick-wrap:hover .tl-tick {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15);
  }
  .tl-tick.active {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb),.18);
  }
  .tl-tick-wrap .tl-tooltip {
    opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(-4px);
    transition: opacity .18s var(--ease-out), transform .18s var(--ease-out);
  }
    .tl-tick-wrap:hover .tl-tooltip { opacity: 0; }
  .tl-tooltip {
    position: absolute; left: 50%; bottom: calc(100% + 6px);
    transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 5px 9px;
    border-radius: var(--radius-sm); font-family: var(--font); font-size: 11px; font-weight: 500;
    white-space: nowrap; pointer-events: none; z-index: 10; box-shadow: var(--shadow-md);
  }
  .tl-year { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font); font-size: 11px; color: var(--ink-2); font-weight: 600; letter-spacing: 0.02em; }
  .tl-place { position: absolute; top: 42px; transform: translateX(-50%); font-family: var(--font); font-size: 11px; color: var(--muted); white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .tl-place.active { color: var(--accent); font-weight: 600; }
  .orgs::-webkit-scrollbar { height: 4px; }
  .orgs::-webkit-scrollbar-thumb { background: rgba(42,36,29,.18); }

  /* ── Share + toast ── */
  .share-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 8px 16px 8px 12px; font-family: var(--font); font-size: 11px;
    font-weight: 600; letter-spacing: 0.04em; cursor: pointer;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(var(--accent-rgb),.35);
    transition: transform .25s var(--ease-spring), background .2s, box-shadow .25s;
    animation: shareAppear .6s .4s var(--ease-spring) both;
  }
  @keyframes shareAppear { from { opacity: 0; transform: scale(.85) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .share-btn:hover { transform: translateY(-2px) scale(1.04); background: var(--accent-deep); box-shadow: 0 6px 20px rgba(var(--accent-rgb),.45); }
  .share-btn svg { width: 13px; height: 13px; }
  .share-toast {
    position: fixed; top: 72px; right: 24px; z-index: 600;
    background: var(--ink); color: var(--bg); padding: 10px 16px;
    border-radius: var(--radius-md); font-family: var(--font); font-size: 11px; font-weight: 500;
    letter-spacing: 0.04em; box-shadow: var(--shadow-md);
    animation: toastIn .3s var(--ease-spring) forwards; pointer-events: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .share-toast.out { animation: toastOut .3s var(--ease-out) forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

  /* ── Intro splash ── */
  #intro-splash {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
    overflow: hidden;
  }
  #intro-splash.fade-out { opacity: 0; transform: scale(1.05); pointer-events: none; }

  /* 배경 격자 */
  #intro-splash::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(161,31,45,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(161,31,45,.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    animation: gridFadeIn 1.2s var(--ease-out) both;
  }
  body.theme-dark #intro-splash::before {
    background-image:
      linear-gradient(rgba(232,93,60,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,93,60,.06) 1px, transparent 1px);
  }
  @keyframes gridFadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 중앙 방사형 그라데이션 */
  #intro-splash::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 60% at 50% 50%, var(--bg) 40%, transparent 100%);
    pointer-events: none;
  }

  /* 나침반 */
  .splash-compass {
    width: 160px; height: 160px; position: relative; z-index: 1;
    animation: splashBounce 1s var(--ease-spring) forwards; opacity: 0;
  }
  .splash-compass .ring {
    animation: compassRingSpin 14s linear infinite;
    transform-origin: center;
  }
  .splash-compass .needle {
    animation: compassNeedle 2s .15s var(--ease-spring) forwards;
    transform-origin: 80px 80px;
    transform: rotate(-260deg);
  }
  @keyframes compassNeedle {
    0%   { transform: rotate(-260deg); }
    55%  { transform: rotate(14deg); }
    75%  { transform: rotate(-7deg); }
    90%  { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes compassRingSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .splash-title {
    font-family: var(--font); font-size: 38px; font-weight: 800;
    letter-spacing: -0.03em; color: var(--ink);
    margin-top: 28px; line-height: 1.15;
    animation: splashFadeUp .8s .38s var(--ease-out) forwards; opacity: 0;
    position: relative; z-index: 1; text-align: center;
  }
  .splash-title span { color: var(--accent); }
  .splash-sub {
    font-family: var(--font); font-size: 11px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-top: 10px;
    font-weight: 500; animation: splashFadeUp .8s .55s var(--ease-out) forwards; opacity: 0;
    position: relative; z-index: 1;
  }

  /* 카운터 */
  .splash-counters {
    display: flex; gap: 0; margin-top: 52px;
    animation: splashFadeUp .8s .7s var(--ease-out) forwards; opacity: 0;
    position: relative; z-index: 1;
    border: 1px solid rgba(42,36,29,.12); border-radius: var(--radius-lg);
    overflow: hidden; background: var(--paper);
    box-shadow: var(--shadow-md);
  }

<script>
function animateCount(el, target, dur) {
  const s = performance.now();
  (function f(now) {
    const t = Math.min((now-s)/dur,1), e = 1-Math.pow(1-t,3);
    el.textContent = Math.round(e*target);
    if (t<1) requestAnimationFrame(f); else el.textContent = target;
  })(performance.now());
}
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    animateCount(document.getElementById('sc-years'), 30, 1200);
    animateCount(document.getElementById('sc-orgs'), 10, 900);
    animateCount(document.getElementById('sc-places'), 33, 1400);
  }, 800);
});
function enterSite() {
  const s = document.getElementById('intro-splash');
  s.classList.add('fade-out');
  setTimeout(() => { s.style.display = 'none'; }, 750);
}
window.__sharePlace = function(name, addr) {
  const txt = `자원봉사능력개발원 30년의 자리\n📍 ${name}\n${addr}\n${location.href}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => showToast('링크 복사됨 ✓'));
  } else { showToast('복사를 지원하지 않는 환경입니다'); }
};
function showToast(msg) {
  const old = document.querySelector('.share-toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'share-toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, 2200);
}
function showKbToast(msg) {
  const old = document.querySelector('.kb-toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'kb-toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 280); }, 1400);
}
</script>

// ── Search index ──
const SEARCH_INDEX = [];
ORGS.forEach(org => {
  org.places.forEach(place => {
    SEARCH_INDEX.push({ org, place, label: `${org.name} · ${place.name}`, addr: place.addr });
  });
});

function highlight(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text;
  return (
    <>{text.slice(0,i)}<span className="sri-mark">{text.slice(i,i+q.length)}</span>{text.slice(i+q.length)}</>
  );
}

function SearchBar({ onSelect }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  const results = q.length >= 1 ? SEARCH_INDEX.filter(x =>
    x.label.includes(q) || x.addr.includes(q) || x.place.story.some(s=>s.includes(q))
  ).slice(0,8) : [];

  useEffect(() => {
    function click(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', click);
    return () => document.removeEventListener('mousedown', click);
  }, []);

  return (
    <div className="search-wrap" ref={ref}>
      <svg className="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        className="search-input"
        type="text"
        placeholder="기관·장소·주소 검색..."
        value={q}
        onChange={e => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
      />
      {open && q.length >= 1 && (
        <div className="search-results">
          {results.length === 0
            ? <div className="search-empty">검색 결과 없음</div>
            : results.map((r, i) => (
              <div key={i} className="search-result-item" onClick={() => {
                onSelect(r.org.id, r.place.id);
                setQ(''); setOpen(false);
              }}>
                <span className="sri-name">{highlight(r.place.name, q)}</span>
                <span className="sri-org">{highlight(r.org.name, q)} · {r.place.period}</span>
              </div>
            ))
          }
        </div>
      )}
    </div>
  );
}

function PhotoSlider({ photos, year }) {
  const [idx, setIdx] = useState(0);
  const startX = useRef(null);
  const total = photos.length;

  // reset to first slide when photos change (place changed)
  useEffect(() => { setIdx(0); }, [photos]);

  const prev = () => setIdx(i => Math.max(0, i-1));
  const next = () => setIdx(i => Math.min(total-1, i+1));

  const onTouchStart = e => { startX.current = e.touches[0].clientX; };
  const onTouchEnd = e => {
    if (startX.current === null) return;
    const dx = e.changedTouches[0].clientX - startX.current;
    if (dx < -50) next();
    else if (dx > 50) prev();
    startX.current = null;
  };

  return (
    <div className="photo-slider" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <div className="photo-slider-track" style={{transform:`translateX(-${idx*100}%)`}}>
        {photos.map((slide, i) => (
          <div className="photo-slide" key={i}>
            {slide.src
              ? <img src={slide.src} alt={slide.caption||''} />
              : <EraArt year={year} />
            }
            {slide.caption && <div className="slider-caption">{slide.caption}</div>}
          </div>
        ))}
      </div>

      {total > 1 && <span className="slider-count">{idx+1} / {total}</span>}

      {total > 1 && (
        <>
          <button className="slider-arrow prev" onClick={prev} disabled={idx===0}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button className="slider-arrow next" onClick={next} disabled={idx===total-1}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <div className="slider-dots">
            {photos.map((_,i)=>(
              <button key={i} className={`slider-dot ${i===idx?'active':''}`} onClick={()=>setIdx(i)} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function EraArt({ year }) {
  const canvasRef = useRef(null);
  const yr = parseInt(year, 10);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.offsetWidth || 400, H = canvas.offsetHeight || 300;
    canvas.width = W; canvas.height = H;
    const eras = [
      { y:1996, bg:['#2c1a0e','#4a2c1a'], a:'#c87941', b:'#8b3a2a' },
      { y:1997, bg:['#0d1a2e','#1a2d4a'], a:'#4a90d9', b:'#2a5080' },
      { y:2000, bg:['#1a2a1a','#2a3d2a'], a:'#5aaa5a', b:'#2a6a2a' },
      { y:2002, bg:['#2a1a2e','#3d2a4a'], a:'#9b59b6', b:'#6c3483' },
      { y:2003, bg:['#2a1a10','#4a2e1a'], a:'#e67e22', b:'#a04000' },
      { y:2004, bg:['#0e1a2a','#1a2e4a'], a:'#2980b9', b:'#1a5a8a' },
      { y:2005, bg:['#1a2a1e','#2a3d2e'], a:'#27ae60', b:'#1a6a3a' },
      { y:2009, bg:['#1e1a2a','#2e2a3d'], a:'#8e44ad', b:'#5a1a7a' },
      { y:2010, bg:['#1a1a2a','#2a2a3d'], a:'#3498db', b:'#1a5a9a' },
      { y:2011, bg:['#1a2a2a','#2a3d3d'], a:'#1abc9c', b:'#0a7a6a' },
      { y:2016, bg:['#2a1a1a','#3d2a2a'], a:'#e74c3c', b:'#8a1a1a' },
      { y:2019, bg:['#1a1e2a','#2a2e3d'], a:'#5dade2', b:'#1a4a7a' },
      { y:2021, bg:['#1e2a1a','#2e3d2a'], a:'#58d68d', b:'#1a6a3a' },
      { y:2025, bg:['#2a2a1a','#3d3d2a'], a:'#f4d03f', b:'#9a7a0a' },
    ];
    const era = eras.slice().reverse().find(e=>e.y<=yr)||eras[0];
    const grd = ctx.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,era.bg[0]); grd.addColorStop(1,era.bg[1]);
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    for(let i=0;i<3000;i++){const x=Math.random()*W,y=Math.random()*H,aa=Math.random()*0.12;ctx.fillStyle=`rgba(255,255,255,${aa})`;ctx.fillRect(x,y,1,1);}
    ctx.globalAlpha=0.18;
    for(let i=0;i<5;i++){const x=(W/5)*i+Math.random()*50-25,y=H*.3+Math.random()*H*.4,r=30+Math.random()*60;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=era.a;ctx.fill();}
    ctx.globalAlpha=0.10;
    for(let i=0;i<3;i++){const x=Math.random()*W,y=Math.random()*H,s=40+Math.random()*70;ctx.fillStyle=era.b;ctx.fillRect(x,y,s,s);}
    ctx.globalAlpha=0.05;
    for(let y2=0;y2<H;y2+=4){ctx.fillStyle='#fff';ctx.fillRect(0,y2,W,1);}
    ctx.globalAlpha=0.12; ctx.fillStyle=era.a;
    ctx.font=`800 ${Math.round(H*.44)}px Pretendard,-apple-system,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(year,W/2,H/2);
    const fade=ctx.createLinearGradient(0,H*.5,0,H);
    fade.addColorStop(0,'rgba(0,0,0,0)'); fade.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.globalAlpha=1; ctx.fillStyle=fade; ctx.fillRect(0,0,W,H);
  }, [year]);
  return (
    <div className="ph-photo-era">
      <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}} />
      <span className="era-year-tag">{year}</span>
      <span className="era-label">당시 사진 · PHOTO</span>
    </div>
  );
}

function PlaceDetail({ place, totalPlaces, orgNote, org, activeIdx, onPrev, onNext }) {
  if (!place) return null;
  // Mobile swipe
  const startX = useRef(null);
  const handleTouchStart = e => { startX.current = e.touches[0].clientX; };
  const handleTouchEnd = e => {
    if (startX.current === null) return;
    const dx = e.changedTouches[0].clientX - startX.current;
    if (Math.abs(dx) > 60) { if (dx < 0) onNext(); else onPrev(); }
    startX.current = null;
  };

  const prevPlace = activeIdx > 0 ? org.places[activeIdx-1] : null;
  const nextPlace = activeIdx < org.places.length-1 ? org.places[activeIdx+1] : null;
  // photos: place.photos 있으면 사용, 없으면 EraArt 1장
  const slides = place.photos && place.photos.length > 0
    ? place.photos
    : [{ src: null }];  // null src → EraArt 렌더
  return (
    <div className="panel-content" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
      <PhotoSlider photos={slides} year={place.year} />
      <div className="ph-meta">
        <span className="ph-num">CHAPTER · {String(place.id).padStart(2,'0')} / {String(totalPlaces).padStart(2,'0')}</span>
        <span className="ph-yrs">{place.period}</span>
      </div>
      <h3 className="ph-name">{place.name}</h3>
      <div className="ph-addr"><span className="label">ADDRESS</span>{place.addr}</div>
      <div className="ph-story">{place.story.map((p,i)=><p key={i}>{p}</p>)}</div>
      {place.miles && place.miles.length > 0 && (
        <>
          <div className="ph-mile-title">주요 사업 · 이정표</div>
          <ul className="ph-miles">
            {place.miles.map(([y,t],i)=>(
              <li key={i}><span className="yr">{y}</span>{t}</li>
            ))}
          </ul>
        </>
      )}
      {orgNote && <div className="ph-note">※ {orgNote}</div>}
      <div className="ph-nav">
        <button className="ph-nav-btn prev" onClick={onPrev} disabled={!prevPlace}>
          <span className="arrow">← PREV</span>
          <span className="nm">{prevPlace ? prevPlace.name : '— 처음입니다'}</span>
        </button>
        <button className="ph-nav-btn next" onClick={onNext} disabled={!nextPlace}>
          <span className="arrow">NEXT →</span>
          <span className="nm">{nextPlace ? nextPlace.name : '— 마지막입니다'}</span>
        </button>
      </div>
    </div>
  );
}

function App() {
  const [orgId, setOrgId] = useState('main');
  const [activeId, setActiveId] = useState(1);
  const [styleKey, setStyleKey] = useState('light');
  const [isMobile, setIsMobile] = useState(false);
  const [sheetExpanded, setSheetExpanded] = useState(false);
  const [displayYears, setDisplayYears] = useState(0);
  const [displayOrgs, setDisplayOrgs] = useState(0);
  const [displayLocs, setDisplayLocs] = useState(0);

  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const tileLayerRef = useRef(null);
  const labelLayerRef = useRef(null);
  const markersRef = useRef([]);
  const polylineRef = useRef(null);
  const sheetRef = useRef(null);
  const dragState = useRef(null);

  const totalPlacesCount = ORGS.reduce((a,o)=>a+o.places.length,0);
  const org = ORGS.find(o=>o.id===orgId);
  const place = org.places.find(p=>p.id===activeId)||org.places[0];
  const activeIdx = org.places.findIndex(p=>p.id===(place?place.id:-1));
  const goPrev = () => activeIdx>0 && setActiveId(org.places[activeIdx-1].id);
  const goNext = () => activeIdx<org.places.length-1 && setActiveId(org.places[activeIdx+1].id);

  // Count-up on mount
  useEffect(() => {
    function cu(setter,target,dur){ const s=performance.now();(function f(now){const t=Math.min((now-s)/dur,1),e=1-Math.pow(1-t,3);setter(Math.round(e*target));if(t<1)requestAnimationFrame(f);else setter(target);})(performance.now()); }
    const d=setTimeout(()=>{ cu(setDisplayYears,30,1000); cu(setDisplayOrgs,10,800); cu(setDisplayLocs,totalPlacesCount,1200); },900);
    return ()=>clearTimeout(d);
  }, []);

  // Keyboard shortcuts
  useEffect(() => {
    function onKey(e) {
      if (e.target.tagName==='INPUT') return;
      if (e.key==='ArrowRight'||e.key==='ArrowDown') { goNext(); showKbToast('다음 장소 →'); }
      else if (e.key==='ArrowLeft'||e.key==='ArrowUp') { goPrev(); showKbToast('← 이전 장소'); }
      else {
        const n = parseInt(e.key,10);
        if (n>=1&&n<=ORGS.length) { const o=ORGS[n-1]; setOrgId(o.id); setActiveId(o.places[0].id); showKbToast(`${n}. ${o.name}`); }
      }
    }
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, [activeIdx, orgId]);

  // Mobile detection
  useEffect(() => { const check=()=>setIsMobile(window.innerWidth<=820); check(); window.addEventListener('resize',check); return()=>window.removeEventListener('resize',check); }, []);

  // Theme
  useEffect(() => { document.body.classList.toggle('theme-dark', TILE_STYLES[styleKey].dark); }, [styleKey]);

  // Org change → reset place
  useEffect(() => { setActiveId(org.places[0].id); }, [orgId]);

  // Init map
  useEffect(() => {
    if (mapInstance.current) return;
    mapInstance.current = L.map(mapRef.current, { center:[35.859,128.582], zoom:11, zoomControl:true, attributionControl:true, preferCanvas:true, wheelPxPerZoomLevel:140, zoomSnap:1, zoomDelta:1, scrollWheelZoom:true });
      // 전체 마커가 한눈에 보이게 초기 뷰 자동 조정
      setTimeout(()=>{
        const map = mapInstance.current; if(!map) return;
        const initOrg = ORGS[0];
        const initCoords = initOrg.places.map(p=>[p.lat,p.lng]);
        const bounds = L.latLngBounds(initCoords);
        map.fitBounds(bounds, {padding:[60,60], maxZoom:13});
      }, 100);
    if(window.innerWidth<=820){
      setTimeout(()=>{
        const map=mapInstance.current; if(!map) return;
        const initOrg=ORGS[0];
        if(initOrg.places.length>1){
          const b=L.latLngBounds(initOrg.places.map(p=>[p.lat,p.lng]));
          const panelH=Math.round(window.innerHeight*0.48);
          map.flyToBounds(b,{padding:[40,40,panelH+20,40],duration:0,maxZoom:13});
        }
      },500);
    }
  }, []);

  // Tile layer
  useEffect(() => {
    const map=mapInstance.current; if(!map) return;
    const style=TILE_STYLES[styleKey];
    if(tileLayerRef.current) map.removeLayer(tileLayerRef.current);
    if(labelLayerRef.current) map.removeLayer(labelLayerRef.current);
    tileLayerRef.current = L.tileLayer(style.url,{attribution:style.attribution,maxZoom:style.maxZoom,subdomains:'abcd'}).addTo(map);
    labelLayerRef.current = L.tileLayer(style.labelUrl,{maxZoom:style.maxZoom,subdomains:'abcd',pane:'shadowPane'}).addTo(map);
  }, [styleKey]);

  // Markers + route
  useEffect(() => {
    const map=mapInstance.current; if(!map) return;
    markersRef.current.forEach(m=>map.removeLayer(m)); markersRef.current=[];
    if(polylineRef.current){map.removeLayer(polylineRef.current);polylineRef.current=null;}
    if(org.places.length>1){
      polylineRef.current=L.polyline(org.places.map(p=>[p.lat,p.lng]),{
        color:TILE_STYLES[styleKey].dark?'#ff6b3d':'#a11f2d',
        weight:1.8,opacity:.55,dashArray:'2 7',lineCap:'round'
      }).addTo(map);
    }
    org.places.forEach((p,i)=>{
      const isActive=p.id===place.id,isPast=i<activeIdx;
      const cls=`pin-marker ${isActive?'active':''} ${isPast?'past':''}`;
      const icon=L.divIcon({html:`<div class="${cls}">${p.id}</div>`,className:'pin-wrap',iconSize:[32,32],iconAnchor:[16,16]});
      const marker=L.marker([p.lat,p.lng],{icon,riseOnHover:true,riseOffset:1000})
        .addTo(map)
        .on('click',()=>{setActiveId(p.id);if(window.innerWidth<=820)setSheetExpanded(true);});
      marker.bindTooltip(`<div class="pin-label-overlay"><span class="yr">${p.year}</span>${p.name}</div>`,{direction:'right',offset:[16,0],className:'pin-tooltip',opacity:1});
      markersRef.current.push(marker);
    });
    if(org.places.length===1) map.flyTo([org.places[0].lat,org.places[0].lng],window.innerWidth<=820?13:14,{duration:.9});
    else{const b=L.latLngBounds(org.places.map(p=>[p.lat,p.lng]));const isMob=window.innerWidth<=820;const panelH=isMob?Math.round(window.innerHeight*0.48):80;map.flyToBounds(b,{padding:isMob?[40,40,panelH+20,40]:[80,80],duration:1.1,maxZoom:14,easeLinearity:.25});}
  }, [orgId,styleKey]);

  // Update marker classes on activeId change
  useEffect(() => {
    const map=mapInstance.current; if(!map||!place) return;
    markersRef.current.forEach(m=>{
      const el=m.getElement&&m.getElement(); if(!el) return;
      const inner=el.querySelector('.pin-marker'); if(!inner) return;
      const id=parseInt(inner.textContent,10);
      const idx=org.places.findIndex(p=>p.id===id);
      inner.className=`pin-marker ${id===place.id?'active':''} ${idx<activeIdx?'past':''}`;
    });
  }, [activeId]);

  // Fly to active place
  useEffect(() => {
    const map=mapInstance.current; if(!map||!place) return;
    map.flyTo([place.lat,place.lng],Math.max(map.getZoom(),14),{duration:1.2,easeLinearity:.2});
  }, [activeId]);

  // Reset map view
  const resetView = () => {
    const map=mapInstance.current; if(!map) return;
    if(org.places.length===1) map.flyTo([org.places[0].lat,org.places[0].lng],14,{duration:1});
    else{const b=L.latLngBounds(org.places.map(p=>[p.lat,p.lng]));const isMob=window.innerWidth<=820;const panelH=isMob?Math.round(window.innerHeight*0.48):80;map.flyToBounds(b,{padding:isMob?[40,40,panelH+20,40]:[80,80],duration:1.1,maxZoom:14});}
  };

  // Mobile sheet drag
  const onHandleStart = e=>{const y=e.touches?e.touches[0].clientY:e.clientY;dragState.current={startY:y,expanded:sheetExpanded};e.preventDefault();};
  const onHandleMove = e=>{if(!dragState.current)return;const y=e.touches?e.touches[0].clientY:e.clientY,dy=y-dragState.current.startY;if(Math.abs(dy)<30)return;if(dy<-40&&!dragState.current.expanded){setSheetExpanded(true);dragState.current=null;}else if(dy>40&&dragState.current.expanded){setSheetExpanded(false);dragState.current=null;}};
  const onHandleEnd=()=>{dragState.current=null;};
  useEffect(()=>{
    if(!isMobile)return;
    window.addEventListener('mousemove',onHandleMove);window.addEventListener('mouseup',onHandleEnd);
    window.addEventListener('touchmove',onHandleMove,{passive:false});window.addEventListener('touchend',onHandleEnd);
    return()=>{window.removeEventListener('mousemove',onHandleMove);window.removeEventListener('mouseup',onHandleEnd);window.removeEventListener('touchmove',onHandleMove);window.removeEventListener('touchend',onHandleEnd);};
  },[isMobile,sheetExpanded]);

  const handleSearch = (newOrgId, newPlaceId) => { setOrgId(newOrgId); setActiveId(newPlaceId); };
  const handleShare = () => { if(window.__sharePlace) window.__sharePlace(place.name,place.addr); };

  const timelineEl = (
    <div className="timeline">
      <div className="tl-track">
        <div className="tl-line" />
        {org.places.map((p,i)=>{
          const n = org.places.length;
          const pct = n===1 ? 50 : (i/(n-1))*100;
          const isActive=p.id===place.id;
          return (
            <React.Fragment key={p.id}>
              <div className="tl-year" style={{left:`${pct}%`}}>{p.year}</div>
              <div className={`tl-tick-wrap`} style={{left:`${pct}%`}} onClick={()=>setActiveId(p.id)}>
                <div className={`tl-tick ${isActive?'active':''}`} />
                {!isActive && <div className="tl-tooltip">{p.shortName||p.name}</div>}
              </div>
              <div className={`tl-place ${isActive?'active':''}`} style={{left:`${pct}%`}}>{p.shortName||p.name}</div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );

  const detailEl = (
    <PlaceDetail key={`${orgId}-${place.id}`} place={place} totalPlaces={org.places.length}
      orgNote={org.note} org={org} activeIdx={activeIdx} onPrev={goPrev} onNext={goNext} />
  );

  return (
    <div className="app">
      <header className="top">
        <div className="header-left">
          <div className="brand">
            <svg className="brand-compass" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g className="ring">
                <circle cx="18" cy="18" r="16" stroke="rgba(161,31,45,0.2)" strokeWidth="1"/>
                <circle cx="18" cy="18" r="16" stroke="rgba(161,31,45,0.55)" strokeWidth="1" strokeDasharray="3 6" strokeLinecap="round"/>
                <text x="18" y="5.5" textAnchor="middle" fontFamily="Pretendard,sans-serif" fontSize="4.5" fontWeight="700" fill="rgba(161,31,45,0.8)">N</text>
              </g>
              <circle cx="18" cy="18" r="1.5" fill="var(--accent)"/>
              <g className="needle">
                <polygon points="18,7 16.5,18 19.5,18" fill="var(--accent)"/>
                <polygon points="18,29 16.5,18 19.5,18" fill="rgba(161,31,45,0.22)"/>
              </g>
            </svg>
            <div>
              <h1>Atlas : 우리가 남긴 궤적을 따라</h1>
              <div className="sub">Volunteer Capacity Development Institute · Est. 1996</div>
            </div>
          </div>
          <div className="header-stats">
            <div className="stat"><div className="num">{displayYears}<small>년</small></div><div className="lbl">Since 1996</div></div>
            <div className="stat"><div className="num">{displayOrgs}<small>기관</small></div><div className="lbl">Organizations</div></div>
            <div className="stat"><div className="num">{displayLocs}<small>곳</small></div><div className="lbl">Locations</div></div>
          </div>
        </div>
        <div className="header-right">
          <SearchBar onSelect={handleSearch} />
          <div className="kb-hint">
            <span className="kb-label">단축키</span>
            <kbd>← →</kbd> 장소 이동
            <kbd>1–{ORGS.length}</kbd> 기관 전환
          </div>
          <button className="share-btn" onClick={handleShare}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            SHARE
          </button>
        </div>
      </header>

      <div className="orgs">
        {ORGS.map((o,i)=>(
          <button key={o.id} className={`org-pill ${o.id===orgId?'on':''}`}
            onClick={()=>setOrgId(o.id)} title={o.sub}>
            <span className="num">{String(i+1).padStart(2,'0')}</span>
            <span>{o.name}</span>
            <span className="badge">{o.places.length}</span>
          </button>
        ))}
      </div>

      <div className="map-wrap">
        <div id="map" ref={mapRef}></div>
        <div className="map-overlay map-corner">35.8714° N · 128.6014° E · DAEGU</div>
        <button className="map-reset" onClick={resetView} title="전체 보기">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          전체 보기
        </button>
        <div className="style-switch">
          {Object.entries(TILE_STYLES).map(([k,v])=>(
            <button key={k} className={k===styleKey?'on':''} onClick={()=>setStyleKey(k)}>{v.name}</button>
          ))}
        </div>
      </div>


      {!isMobile && (
        <>
          <aside className="panel">
            <div className="org-head">
              <div className="ekey">{org.sub.toUpperCase()}</div>
              <h2 className="ename">{org.name}</h2>
              <div className="eperiod">{org.period} · 사무소 {org.places.length}곳</div>
            </div>
            {detailEl}
          </aside>
          {timelineEl}
        </>
      )}

      {isMobile && (
        <aside className={`panel ${sheetExpanded?'expanded':'collapsed'}`} ref={sheetRef}>
          <div className="sheet-handle" onMouseDown={onHandleStart} onTouchStart={onHandleStart} onClick={()=>setSheetExpanded(v=>!v)}>
            <div className="bar"></div>
          </div>
          {timelineEl}
          <div className="panel-scroll">
            <div className="org-head">
              <div className="ekey">{org.sub.toUpperCase()}</div>
              <h2 className="ename">{org.name}</h2>
              <div className="eperiod">{org.period} · 사무소 {org.places.length}곳</div>
            </div>
            {detailEl}
          </div>
        </aside>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
